name: Bootstrap VaultSecure Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild verified archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/chunk-00 \
            .bootstrap/chunk-01 \
            .bootstrap/fixed-02a \
            .bootstrap/fixed-02b-a \
            .bootstrap/fixed-02b-b-a \
            .bootstrap/fixed-02b-b-b-a \
            .bootstrap/fixed-02b-b-b-b \
            .bootstrap/chunk-03 \
            .bootstrap/chunk-04 \
            .bootstrap/fixed-05a \
            .bootstrap/fixed-05b-a \
            .bootstrap/fixed-05b-b \
            .bootstrap/fixed-06a \
            .bootstrap/fixed-06b \
            .bootstrap/chunk-07 \
            .bootstrap/chunk-08 \
            > /tmp/vaultsecure.b64

          test "$(wc -c < /tmp/vaultsecure.b64)" -eq 62292
          base64 --decode /tmp/vaultsecure.b64 > /tmp/vaultsecure.tar.gz
          echo '422aca69b32b89e79dc8338a646a155da4abdc5343fcdb6ed565f826e7734143  /tmp/vaultsecure.tar.gz' | sha256sum -c -
          gzip -t /tmp/vaultsecure.tar.gz

      - name: Extract project safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vaultsecure-unpack
          mkdir -p /tmp/vaultsecure-unpack
          tar -xzf /tmp/vaultsecure.tar.gz -C /tmp/vaultsecure-unpack

          ROOT=/tmp/vaultsecure-unpack
          if [ -f "$ROOT/VaultSecure/package.json" ]; then
            ROOT="$ROOT/VaultSecure"
          fi

          test -f "$ROOT/package.json"
          test -d "$ROOT/app"
          test -d "$ROOT/src"

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .bootstrap \
            ! -name .github \
            -exec rm -rf {} +

          cp -a "$ROOT"/. .

          mkdir -p .workflow-staging
          cp .github/workflows/ci.yml .workflow-staging/ci.yml
          cp .github/workflows/release.yml .workflow-staging/release.yml
          cp .github/workflows/web.yml .workflow-staging/web.yml
          rm -f .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/web.yml
          rm -rf .bootstrap

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f app.json
          test -d app
          test -d src
          test -f supabase/schema.sql
          test -f .workflow-staging/ci.yml
          test -f .workflow-staging/release.yml
          test -f .workflow-staging/web.yml
          grep -qi 'vaultsecure' package.json
          if grep -RIl --exclude='.env.example' -E '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_live_[A-Za-z0-9]{16,}|sb_secret_[A-Za-z0-9_-]{16,})' .; then
            echo 'Potential committed secret detected.' >&2
            exit 1
          fi

      - name: Commit source without workflow mutations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset -- .github/workflows/bootstrap-source.yml
          git commit -m 'Add complete VaultSecure application source'
          git push origin HEAD:main
